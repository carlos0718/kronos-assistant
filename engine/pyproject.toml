[project]
name = "kronos-engine"
version = "0.6.0"
description = "Motor de Kronos AI Assistant: voz, LLM, herramientas, permisos y memoria."
authors = [
    { name = "carlos0718", email = "62729276+carlos0718@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
kronos-engine = "kronos_engine.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

# Las reglas y el porqué de cada chequeo están en docs/CODIGO.md.
[tool.ruff.lint]
select = [
    "E", "W", "F",  # errores y avisos básicos
    "I",            # orden de los imports
    "B",            # errores frecuentes
    "UP",           # sintaxis moderna de Python
    "SIM", "C4",    # código más simple
    "C90",          # complejidad de las funciones
    "BLE",          # no atrapar Exception sin motivo
    "ASYNC",        # errores de asyncio
    "PT",           # estilo de los tests
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src", "tests"]

# Librerías de voz que no publican tipos.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "onnxruntime.*", "piper.*", "sounddevice.*"]
ignore_missing_imports = true

# Qué paquete del motor puede importar a cuál. De arriba hacia abajo: cada
# capa solo importa de las que tiene debajo.
[tool.importlinter]
root_package = "kronos_engine"

[[tool.importlinter.contracts]]
name = "Capas del motor"
type = "layers"
layers = [
    "kronos_engine.__main__",
    "kronos_engine.pipeline",
    "kronos_engine.api | kronos_engine.agent | kronos_engine.config | kronos_engine.llm | kronos_engine.voice",
    "kronos_engine.core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
