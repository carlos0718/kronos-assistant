<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 120 120">
  <!-- Logo de Kronos: esfera con anillo orbital. Fuente de todos los íconos:
       se regeneran desde apps/desktop con "pnpm tauri icon src-tauri/icons/kronos.svg".
       Los trazos son más gruesos que en la bolita animada para que se lea a 16 px. -->
  <defs>
    <radialGradient id="sphere" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <clipPath id="front">
      <rect x="0" y="60" width="120" height="60"/>
    </clipPath>
  </defs>
  <g transform="rotate(-20 60 60)">
    <ellipse cx="60" cy="60" rx="52" ry="17" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="60" cy="60" r="33" fill="url(#sphere)"/>
    <ellipse cx="60" cy="60" rx="52" ry="17" fill="none" stroke="url(#ring)" stroke-width="7" clip-path="url(#front)"/>
  </g>
</svg>
